<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Altend Support</title>
  <meta name="description" content="Support for the Altend iOS app.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111111;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --accent: #178a8d;
      --card: #1b1b1b;
      --border: #2d2d2d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 72px 24px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.3rem, 7vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }
    .intro {
      color: var(--muted);
      font-size: 1.08rem;
      margin: 0 0 36px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      margin-top: 24px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 1.35rem;
    }
    p { margin: 0 0 14px; }
    a {
      color: #38b7ba;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .small {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Altend Support</h1>
    <p class="intro">Need help with Altend or want to send feedback?</p>

    <section class="card">
      <h2>Contact</h2>
      <p>Email us at <a href="mailto:altend.support@gmail.com">altend.support@gmail.com</a>.</p>
      <p>We’ll do our best to respond as soon as possible.</p>
    </section>

    <section class="card">
      <h2>Privacy</h2>
      <p>Read the <a href="https://altend-support.github.io/altend-privacy/">Altend Privacy Policy</a>.</p>
    </section>

    <p class="small">© 2026 Tanishq Raskar. All rights reserved.</p>
  </main>
</body>
</html>
